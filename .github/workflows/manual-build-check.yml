name: Automatic Android Build Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    name: Android Compilation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile Debug Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace
